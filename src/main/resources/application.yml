server:
  port: 8082

spring:
  application:
    name: crypto-flink-spring
  profiles:
    active: dev

# 파이프라인 실행 플래그. 켜진 파이프라인을 모두 붙여 Flink Job 하나로 띄운다
jobs:
  tradeIntensity:
    enabled: true
  detection:
    enabled: true

# Kafka 설정
kafka:
  bootstrap-servers: localhost:9092
  input-topic: crypto-trades
  dead-letter-topic: crypto-trades-dlq
  metrics-topic: crypto-metrics
  events-topic: crypto-events
  group-id: crypto-flink-group

# Flink 설정
flink:
  checkpoint:
    interval: 10000 # 체크포인트 간격 (ms)
    timeout: 60000 # 체크포인트 타임아웃 (ms)
    min-pause: 5000 # 최소 체크포인트 간격 (ms)
    max-concurrent: 1 # 동시 체크포인트 수
  parallelism: 1 # 병렬 처리 수

# 감지 설정 (금액은 원화, 시간은 체결 시각 기준)
detection:
  large-trade:
    single-amount: 300000000 # 단일 체결 금액 임계치 (3억 원)
    burst-window-seconds: 10 # 집중 체결을 보는 구간
    burst-amount: 300000000 # 구간 안 같은 방향 체결 합 임계치 (3억 원)
    cooldown-seconds: 60 # 같은 종목·조건·방향 재감지 간격
  price-move:
    window-seconds: 300 # 변동률 기준 구간 (5분)
    threshold-percent: 2.0 # 급등·급락 임계치 (±2%)
    cooldown-seconds: 300 # 같은 방향 재감지 간격. 임계치만큼 더 움직이면 그 전에도 낸다

# 체결강도 설정
trade:
  intensity:
    windows-seconds: 60,300,900 # 집계 구간(초). 1분·5분·15분
    slide-seconds: 5 # 갱신 주기(초)

# 로깅 설정
logging:
  level:
    com.crypto.flink: INFO
    org.apache.flink: INFO
    org.apache.kafka: INFO
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n"

# Actuator 설정
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: always
