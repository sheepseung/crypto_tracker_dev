server:
  port: 8082

spring:
  application:
    name: crypto-flink-spring
  profiles:
    active: dev
  kafka:
    bootstrap-servers: ${kafka.bootstrap-servers}
    consumer:
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
  datasource:
    url: jdbc:postgresql://localhost:5432/crypto
    username: crypto
    password: crypto
  sql:
    init:
      mode: always # schema.sql 을 기동마다 실행 (IF NOT EXISTS 라 반복해도 안전)

# 파이프라인 실행 플래그. 켜진 파이프라인을 모두 붙여 Flink Job 하나로 띄운다
jobs:
  tradeIntensity:
    enabled: true
  detection:
    enabled: true

# Kafka 설정
kafka:
  bootstrap-servers: localhost:9092
  input-topic: crypto-trades
  dead-letter-topic: crypto-trades-dlq
  metrics-topic: crypto-metrics
  events-topic: crypto-events
  orderbook-topic: crypto-orderbook # producer 가 넣는 호가 원본. Spring 이 직접 읽는다
  group-id: crypto-flink-group # Flink 소스
  api-group-id: crypto-api # 결과 토픽을 읽는 Spring 소비자

# Flink 설정
flink:
  checkpoint:
    interval: 10000 # 체크포인트 간격 (ms)
    timeout: 60000 # 체크포인트 타임아웃 (ms)
    min-pause: 5000 # 최소 체크포인트 간격 (ms)
    max-concurrent: 1 # 동시 체크포인트 수
  parallelism: 1 # 병렬 처리 수

# 체결 주체 구간 (체결 한 건 금액, 원화). names 는 오름차순 구간 이름, bounds 는 구간 사이 경계라 names 가 하나 더 많다
tiers:
  names: 개미,소형,중형,큰손,고래
  bounds: 100000,1000000,10000000,100000000 # 10만 / 100만 / 1천만 / 1억

# 감지 설정 (금액은 원화, 시간은 체결 시각 기준)
# 임계치·배수·쿨다운은 DB(detection_rule)에 기본 규칙이 없을 때 한 번 심는 초깃값이고, 이후는 /api/rules 로 바꾼다.
# 구간 길이(window·slide·baseline)는 파이프라인 구조라 여기서만 바꾼다.
detection:
  large-trade:
    single-amount: 300000000 # 단일 체결 금액 임계치 (3억 원)
    burst-window-seconds: 10 # 집중 체결을 보는 구간
    burst-amount: 300000000 # 구간 안 같은 방향 체결 합 임계치 (3억 원)
    cooldown-seconds: 60 # 같은 종목·조건·방향 재감지 간격
  price-move:
    window-seconds: 300 # 변동률 기준 구간 (5분)
    threshold-percent: 2.0 # 급등·급락 임계치 (±2%)
    cooldown-seconds: 300 # 같은 방향 재감지 간격. 임계치만큼 더 움직이면 그 전에도 낸다
  volume-surge:
    window-seconds: 300 # 거래대금을 보는 구간 (5분)
    slide-seconds: 5 # 판정 주기
    baseline-hours: 24 # 기준선으로 삼는 과거 길이
    min-baseline-buckets: 12 # 기준선 버킷이 이보다 적으면 판정하지 않음 (1시간어치)
    multiplier: 5.0 # 기준선 평균의 몇 배부터 급증으로 볼지
    cooldown-seconds: 300 # 같은 종목 재감지 간격
    seed-from-upbit: true # 기동 직후 업비트 5분봉으로 기준선을 채울지
  divergence:
    window-seconds: 900 # 고래·개미 순매수를 비교하는 구간 (15분)
    min-tier-ratio: 0.3 # 각 주체가 자기 거래대금의 이 비율 이상 한쪽으로 쏠려야 함
    min-whale-amount: 100000000 # 고래 거래대금이 이보다 작으면 판정 안 함 (1억 원)
    min-retail-amount: 10000000 # 개미 거래대금이 이보다 작으면 판정 안 함 (1천만 원)
    cooldown-seconds: 1800 # 같은 종목·방향 재감지 간격

# 신호 성적표. 30초마다 가격 틱을 남기고 이벤트 뒤 5·15·60분 수익률을 채운다
scorecard:
  tick-retention-days: 14

# 평소 대비 백분위 (최근 N일 5분 버킷 분포에서 지금 값의 위치)
context:
  days: 7
  refresh-seconds: 300

# 체결강도 설정
trade:
  intensity:
    windows-seconds: 60,300,900 # 집계 구간(초). 1분·5분·15분
    slide-seconds: 5 # 갱신 주기(초)

# 김치 프리미엄 (Spring 에서 5초마다 계산, Flink 와 무관)
premium:
  enabled: true
  codes: KRW-BTC,KRW-ETH,KRW-DOGE # 업비트 종목. 바이낸스 심볼은 KRW- 를 떼고 USDT 를 붙인다
  binance-symbols: BTCUSDT,ETHUSDT,DOGEUSDT # 바이낸스 miniTicker 구독 심볼
  refresh-seconds: 5 # 괴리율 계산 주기
  fx-refresh-seconds: 600 # 환율 갱신 주기 (두나무 → 실패 시 open.er-api.com)
  threshold-percent: 5.0 # 괴리율 절댓값이 이 이상이면 KIMCHI_PREMIUM 이벤트
  cooldown-seconds: 1800 # 같은 종목 재감지 간격 (30분)
  jump: # 김프 급변 (G6)
    threshold-points: 0.5 # 5분 새 김프가 이만큼(%p) 변하면 PREMIUM_JUMP
    window-seconds: 300
    cooldown-seconds: 900

# 흡수·유동성 공백 (G5). 5분 버킷을 평소 분포(context)와 가격 변화로 본다
absorption:
  net-percentile: 95 # 순매수가 상위 5%(또는 하위 5%) 안이고
  max-flat-move-percent: 0.1 # 가격은 ±0.1% 안이면 ABSORPTION
  gap-min-move-percent: 1.0 # 가격이 ±1% 넘게 움직였는데
  gap-max-amount-percentile: 30 # 거래대금은 평소 하위 30% 면 LIQUIDITY_GAP
  min-samples: 100 # 분포 표본이 이보다 적으면 판정 안 함 (약 8시간)
  cooldown-seconds: 900

# 호가 불균형 (Spring 에서 호가 토픽을 직접 읽어 계산)
orderbook:
  top-levels: 5 # 금액을 합칠 최우선 호가 개수
  threshold-ratio: 3.0 # 매수÷매도 잔량이 이 이상이면 매수벽, 1/이 값 이하면 매도벽
  hold-seconds: 10 # 쏠림이 이만큼 이어져야 이벤트
  cooldown-seconds: 600 # 같은 종목·방향 재감지 간격
  wall: # 호가 벽 추적 (G3)
    min-amount: 50000000 # 한 호가 잔량 금액이 이 이상 (5천만 원)
    ratio: 5.0 # 같은 쪽 다른 호가 평균의 몇 배 이상이면 벽
    min-lifetime-seconds: 30 # 이보다 짧게 살다 간 벽은 노이즈로 본다
    gone-ratio: 0.2 # 잔량이 최대치의 이 비율 아래로 떨어지면 사라진 것
    cooldown-seconds: 300 # 같은 종목·종류·방향 재감지 간격

# 로깅 설정
logging:
  level:
    com.crypto.flink: INFO
    org.apache.flink: INFO
    org.apache.kafka: INFO
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n"

# Actuator 설정
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: always
